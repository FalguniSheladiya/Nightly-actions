name: nightly-rl

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/falgunisheladiya/nightly-actions/rl-base
  IMAGE_FROZEN: ghcr.io/falgunisheladiya/nightly-actions/rl-frozen

jobs:
  prebuild-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:nightly
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}:cache,mode=max
    
  train-and-gate:
    needs: prebuild-base
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/falgunisheladiya/nightly-actions/rl-base:nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run training
        run: python -m src.train --seed 42 --steps 40000 --out out

      - name: Run pytest
        run: pytest

      - name: Evaluate policy (gate)
        run: python -m src.evaluate --policy out/policy.zip --episodes 20 --min-reward 450 --out out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rl-artifacts
          path: out/

  freeze-and-push:
    needs: train-and-gate
    if: needs.train-and-gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rl-artifacts
          path: out

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FROZEN }}
          tags: |
            type=raw,value=nightly-${{ github.run_id }}
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            custom.seed=42

      - name: Build and push frozen image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frozen.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write summary
        run: |
          echo "## Frozen image" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Mean reward: $(jq '.mean_reward' out/metrics.json)" >> $GITHUB_STEP_SUMMARY

  pinned-experiment:
    needs: freeze-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull frozen image by digest
        run: docker pull ghcr.io/falgunisheladiya/nightly-actions/rl-frozen@${{ needs.freeze-and-push.outputs.digest }}

      - name: Run pinned experiment
        run: |
          mkdir -p out_exp
          docker run --rm \
            -v $PWD/out_exp:/app/out \
            ghcr.io/falgunisheladiya/nightly-actions/rl-frozen@${{ needs.freeze-and-push.outputs.digest }} \
            --policy out/policy.zip --episodes 10 --seed 999 --out out_exp

      - name: Compare baseline vs experiment
        run: |
          BASE=$(jq '.mean_reward' out/metrics.json)
          EXP=$(jq '.mean_reward' out_exp/metrics.json)
          echo "## Comparison" >> $GITHUB_STEP_SUMMARY
          echo "| run | mean_reward |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ----------- |" >> $GITHUB_STEP_SUMMARY
          echo "| baseline | $BASE |" >> $GITHUB_STEP_SUMMARY
          echo "| experiment | $EXP |" >> $GITHUB_STEP_SUMMARY
